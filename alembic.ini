# Alembic configuration for the Offline-First Hospital Record Keeping System.
#
# The database URL is deliberately NOT set here. It is read from the app's
# settings (app.core.config.settings.DATABASE_URL, sourced from .env) inside
# alembic/env.py, so there is exactly one place that knows the credentials.
# Run every alembic command from the project root so this ini is found.

# NOTE ON PERCENT SIGNS
# Alembic parses this file with configparser, which treats ``%`` as an
# interpolation marker. Every literal percent sign below is therefore written
# as ``%%``. This matters most for the database password, which contains
# URL-encoded characters (``%3F`` etc.): that is exactly why the URL is kept
# out of this file and read from .env inside alembic/env.py instead.

[alembic]
# Path to the migration environment script.
script_location = alembic

# Template used by `alembic revision` to render new migration files. The
# doubled ``%%`` is required by configparser interpolation (see note above).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timestamps in generated migrations use local time.
timezone = UTC

# Truncate the "Rev:" line comment to this width.
truncate_slug_length = 40

# Additional paths to scan for SQLAlchemy models, relative to the project root.
# env.py imports the models explicitly, so this is informational only.
version_path_separator = os

[post_write_hooks]
# Hooks that run after `alembic revision` (e.g. formatting). None enabled yet.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

